# MoleculerPy — Local Development Services
#
# Usage:
#   docker compose up -d        # bring up dedicated NATS + Redis for demos
#   docker compose down         # stop (state persists in named volumes)
#   docker compose down -v      # stop + wipe state
#
# Port choices:
#   NATS  4223  (not 4222 — the default is often taken by other projects
#                 like graphrag-nats; use 4223 to stay conflict-free)
#   NATS  8223  monitoring (default 8222 also commonly taken)
#   Redis 6381  (matches the long-standing "demo-valkey" port used by the
#                 demo suite; keeps REDIS_URL=redis://localhost:6381/15
#                 working everywhere without per-demo overrides)
#
# Integration tests that need MQTT / RabbitMQ / Kafka live in
# moleculerpy/tests/integration/docker-compose.yaml and are brought up
# separately with `-p integration up -d mosquitto rabbitmq kafka`.

services:
  nats:
    # Pinned to 2.10 — not the unrestricted 2-alpine tag — for cross-language
    # channels interop. NATS 2.12+ enables JetStream strict mode and bumps
    # the API level to 3, which breaks @moleculer/channels 0.2.0: stream
    # creation calls return `did_create: true` but the streams never actually
    # persist, so Python publishes fail with "no response from stream".
    # moleculerpy-channels' own NATS adapter works fine on 2.12+, so the pin
    # only matters when you need Node.js ↔ Python channels interop.
    # Revisit when @moleculer/channels ships a release compatible with
    # NATS server API level 3.
    image: nats:2.10-alpine
    container_name: moleculerpy-nats
    command: ["--jetstream", "--store_dir", "/data"]
    ports:
      - "4223:4222"
      - "8223:8222"
    volumes:
      - nats-data:/data
    healthcheck:
      test: ["CMD", "nats-server", "--help"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - moleculerpy
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: moleculerpy-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6381:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - moleculerpy
    restart: unless-stopped

volumes:
  nats-data:
  redis-data:

networks:
  moleculerpy:
    driver: bridge
